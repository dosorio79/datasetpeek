[project]
name = "datasetpeek"
version = "0.4.1"
description = "Fast, minimal profiler for CSV and Parquet files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "polars>=1.39.3",
    "robyn>=0.83.0",
]

[dependency-groups]
dev = [
    "coverage>=7.6.1",
    "mypy>=2.4.1",
    "pytest>=9.0.3",
    "ruff>=0.17.3",
]
browser = [
    "playwright>=1.48.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not browser'"
markers = [
    "browser: real-browser smoke tests excluded from the default fast suite",
]

[tool.coverage.run]
branch = true
source = ["app", "main"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["app", "main.py"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
