name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check PR branch flow without checkout
        shell: python
        run: |
          # BEGIN BRANCH POLICY
          import json
          import os
          from pathlib import Path

          if os.environ["GITHUB_EVENT_NAME"] != "pull_request":
              print("Branch policy applies only to pull requests.")
              raise SystemExit(0)

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pr = event["pull_request"]
          base = pr["base"]["ref"]
          head = pr["head"]["ref"]
          repository = (pr["head"].get("repo") or {}).get("full_name")
          allowed = (
              base == "master" and head == "dev" and repository == "dosorio79/datasetpeek"
          ) or (
              base == "dev" and head not in {"dev", "master", "main"}
          )
          if not allowed:
              raise SystemExit("Use feature branches into dev; release only upstream dev into master.")
          print("Branch policy passed.")
          # END BRANCH POLICY

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --group dev --locked
      - name: Run tests with coverage
        run: uv run --locked coverage run -m pytest -q
      - name: Report coverage
        run: uv run --locked coverage report -m
      - name: Write coverage JSON
        run: uv run --locked coverage json -o coverage.json

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked --group dev --group browser
      - name: Install Chromium
        run: uv run --locked --group browser playwright install --with-deps chromium
      - name: Run browser smoke test
        run: make browser-test

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --group dev --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Check types
        run: uv run --locked mypy app main.py

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --group dev --locked
      - name: Check dependency compatibility
        run: uv pip check --python .venv/bin/python
      - name: Audit locked dependencies
        run: uv audit --locked --python-version 3.12 --python-platform linux
